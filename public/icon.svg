<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
      .korean-text {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        font-weight: 900;
        letter-spacing: -2px;
      }
    </style>
    <!-- Background Dark-to-Blue Linear Gradient -->
    <linearGradient id="baseBg" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#0a1b52" />
      <stop offset="30%" stop-color="#123b9e" />
      <stop offset="60%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Bottom-Left Glowing Cyan Radial Gradient -->
    <radialGradient id="cyanGlow" cx="5%" cy="95%" r="85%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="35%" stop-color="#06b6d4" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Bottom-Right Violet/Blue Radial Gradient -->
    <radialGradient id="purpleGlow" cx="95%" cy="95%" r="75%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Light Tint for AI text -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2f5fb" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#baseBg)" />
  <rect width="512" height="512" rx="112" fill="url(#cyanGlow)" />
  <rect width="512" height="512" rx="112" fill="url(#purpleGlow)" />

  <!-- Top Hangul: 센트릭 -->
  <text 
    x="256" 
    y="210" 
    text-anchor="middle" 
    fill="#ffffff" 
    font-size="94" 
    class="korean-text"
  >센트릭</text>

  <!-- Bottom English: AI (Stylized Rounded Vector) -->
  <g fill="none" stroke="url(#aiGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
    <!-- Letter 'A' -->
    <path d="M 166 405 L 222 268 L 278 405" />
    <path d="M 188 348 L 256 348" />

    <!-- Letter 'I' -->
    <path d="M 346 268 L 346 405" />
  </g>
</svg>
